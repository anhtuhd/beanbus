name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Edge Function to deploy
        required: true
        default: dispatch-notification-emails
        type: choice
        options:
          - dispatch-notification-emails
          - resend-webhook
          - email-unsubscribe
          - dispatch-fcm-notifications
          - all

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.function }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0

      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF variable'; exit 1; }

      - name: Deploy selected function
        env:
          FUNCTION: ${{ inputs.function }}
        run: |
          deploy() {
            supabase functions deploy "$1" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt
          }

          case "$FUNCTION" in
            all)
              deploy dispatch-notification-emails
              deploy resend-webhook
              deploy email-unsubscribe
              deploy dispatch-fcm-notifications
              ;;
            dispatch-notification-emails|resend-webhook|email-unsubscribe|dispatch-fcm-notifications)
              deploy "$FUNCTION"
              ;;
            *)
              echo 'Unsupported function selection'
              exit 1
              ;;
          esac
